[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workbench"
version = "0.2.0"
description = "Travel Planning Agent + ReAct workbench: itineraries, tools, memory, traces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kt800hhx-del" }]
dependencies = [
  "httpx>=0.27.0",
  "streamlit>=1.32.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agent-workbench = "agent_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
